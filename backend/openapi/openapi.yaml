openapi: 3.0.0
paths:
  /api/health:
    get:
      operationId: HealthController_getHealth
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseDto"
      tags:
        - health
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: &a1
        - auth
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: *a1
  /api/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: *a1
  /api/trainer/ping:
    get:
      operationId: TrainerPingController_ping
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerPingResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags:
        - trainer
  /api/clients:
    post:
      operationId: ClientsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfileDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: &a2
        - clients
    get:
      operationId: ClientsController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: *a2
  /api/clients/{clientId}/invites:
    post:
      operationId: InvitesController_issue
      parameters:
        - name: clientId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueInviteResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: &a3
        - invites
  /api/clients/{clientId}/invites/active:
    get:
      operationId: InvitesController_activeStatus
      parameters:
        - name: clientId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveInviteStatusDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeDto"
      tags: *a3
info:
  title: Quest Fitness API
  description: Quest Fitness BFF
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          example: ok
          enum:
            - ok
      required:
        - status
    LoginRequestDto:
      type: object
      properties:
        login:
          type: string
          example: adminuser
          description: Логин (lowercase) или телефон E.164 / RU-формат
          minLength: 3
          maxLength: 32
        password:
          type: string
          example: SecretPass1!
          minLength: 8
          format: password
      required:
        - login
        - password
    LoginResponseDto:
      type: object
      properties:
        csrfToken:
          type: string
          description: CSRF token for mutating requests (header x-csrf-token)
      required:
        - csrfToken
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN_ROLE
        - CSRF_INVALID
        - NOT_FOUND
        - CLIENT_LOCKED
        - LOCK_REQUIRED
        - TEMPLATE_VERSION_CONFLICT
        - INVITE_EXPIRED
        - INVITE_ALREADY_CONSUMED
        - SESSION_ABANDONED
        - SESSION_ALREADY_ACTIVE
        - WORKOUT_STATUS_CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorBodyDto:
      type: object
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorEnvelopeDto:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorBodyDto"
      required:
        - error
    LogoutResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    MeResponseDto:
      type: object
      properties:
        login:
          type: string
          example: adminuser
        role:
          type: string
          enum:
            - ADMIN
            - TRAINER
            - CLIENT
          example: ADMIN
      required:
        - login
        - role
    TrainerPingResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    CreateClientRequestDto:
      type: object
      properties:
        displayName:
          type: string
          example: Иван Пуловой
          description: Отображаемое имя слота клиента в общем пуле
          minLength: 1
          maxLength: 128
      required:
        - displayName
    ClientProfileDto:
      type: object
      properties:
        id:
          type: string
          example: clxyz123
        displayName:
          type: string
          example: Иван Пуловой
        userId:
          type: string
          nullable: true
          example: null
          description: Привязка к User после регистрации по инвайту (Story 2.2)
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - userId
        - deactivatedAt
        - createdAt
        - updatedAt
    ClientListResponseDto:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientProfileDto"
      required:
        - clients
    IssueInviteResponseDto:
      type: object
      properties:
        inviteUrl:
          type: string
          example: /invite/abc123opaque
          description: Относительный путь для SPA; origin добавляет FE
        token:
          type: string
          description: Plain token — возвращается один раз при выдаче
        expiresAt:
          type: string
          format: date-time
        expiresAtLabel:
          type: string
          example: до 30 сентября 2026 г., 18:00
          description: Отображение срока в GYM_TIMEZONE (AD-17)
      required:
        - inviteUrl
        - token
        - expiresAt
        - expiresAtLabel
    ActiveInviteStatusDto:
      type: object
      properties:
        hasActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
        expiresAtLabel:
          type: string
          nullable: true
          example: null
      required:
        - hasActive
        - expiresAt
        - expiresAtLabel
