info:
  title: Quest Fitness API
  description: Quest Fitness BFF
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          example: ok
          enum:
            - ok
      required:
        - status
    LoginRequestDto:
      type: object
      properties:
        login:
          type: string
          example: adminuser
          description: Логин (lowercase) или телефон E.164 / RU-формат
          minLength: 3
          maxLength: 32
        password:
          type: string
          example: SecretPass1!
          minLength: 8
          format: password
      required:
        - login
        - password
    LoginResponseDto:
      type: object
      properties:
        csrfToken:
          type: string
          description: CSRF token for mutating requests (header x-csrf-token)
      required:
        - csrfToken
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN_ROLE
        - CSRF_INVALID
        - NOT_FOUND
        - CLIENT_LOCKED
        - LOCK_REQUIRED
        - TEMPLATE_VERSION_CONFLICT
        - INVITE_EXPIRED
        - INVITE_ALREADY_CONSUMED
        - SESSION_ABANDONED
        - SESSION_ALREADY_ACTIVE
        - WORKOUT_STATUS_CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorBodyDto:
      type: object
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorEnvelopeDto:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorBodyDto"
      required:
        - error
    LogoutResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    MeResponseDto:
      type: object
      properties:
        id:
          type: string
          example: cluser123
        login:
          type: string
          example: adminuser
        role:
          type: string
          enum:
            - ADMIN
            - TRAINER
            - CLIENT
          example: ADMIN
      required:
        - id
        - login
        - role
    TrainerPingResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    CreateClientRequestDto:
      type: object
      properties:
        displayName:
          type: string
          example: Иван Пуловой
          description: Отображаемое имя слота клиента в общем пуле
          minLength: 1
          maxLength: 128
      required:
        - displayName
    ClientLockStatusDto:
      type: object
      properties:
        holderTrainerId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - holderTrainerId
        - expiresAt
    ClientMacroProgressSummaryDto:
      type: object
      properties:
        macrocycleId:
          type: string
        currentStageId:
          type: string
          nullable: true
        stagesExhausted:
          type: boolean
          description: True when pointer is null (with progress) or on the last stage by
            sortOrder
        macrocycleName:
          type: string
        currentStageSortOrder:
          type: number
          nullable: true
        stageCount:
          type: number
      required:
        - macrocycleId
        - currentStageId
        - stagesExhausted
    ClientProfileDto:
      type: object
      properties:
        id:
          type: string
          example: clxyz123
        displayName:
          type: string
          example: Иван Пуловой
        userId:
          type: string
          nullable: true
          example: null
          description: Привязка к User после регистрации по инвайту (Story 2.2)
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lockStatus:
          nullable: true
          description: Live lock held by another trainer; null when free or expired
          type: object
          allOf:
            - $ref: "#/components/schemas/ClientLockStatusDto"
        macroProgress:
          nullable: true
          description: Macrocycle stage pointer when assigned (Story 3.4)
          type: object
          allOf:
            - $ref: "#/components/schemas/ClientMacroProgressSummaryDto"
        nextWorkout:
          nullable: true
          description: Earliest pending workout for pool list (Story 4.4)
          allOf:
            - $ref: "#/components/schemas/ClientNextWorkoutDto"
      required:
        - id
        - displayName
        - userId
        - deactivatedAt
        - createdAt
        - updatedAt
    ClientNextWorkoutDto:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - attended
            - skipped
            - cancelled
        isOverdue:
          type: boolean
      required:
        - scheduledAt
        - status
        - isOverdue
    ClientListResponseDto:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientProfileDto"
      required:
        - clients
    ResetClientPasswordResponseDto:
      type: object
      properties:
        temporaryPassword:
          type: string
          description: Временный пароль — показывается один раз (Story 2.6)
          minLength: 8
      required:
        - temporaryPassword
    ClientLockResponseDto:
      type: object
      properties:
        holderTrainerId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - holderTrainerId
        - expiresAt
    AssignClientMacroProgressRequestDto:
      type: object
      properties:
        macrocycleId:
          type: string
        currentStageId:
          type: string
      required:
        - macrocycleId
    PatchClientMacroProgressRequestDto:
      type: object
      properties:
        currentStageId:
          type: string
      required:
        - currentStageId
    IssueInviteResponseDto:
      type: object
      properties:
        inviteUrl:
          type: string
          example: /invite/abc123opaque
          description: Относительный путь для SPA; origin добавляет FE
        token:
          type: string
          description: Plain token — возвращается один раз при выдаче
        expiresAt:
          type: string
          format: date-time
        expiresAtLabel:
          type: string
          example: до 30 сентября 2026 г., 18:00
          description: Отображение срока в GYM_TIMEZONE (AD-17)
      required:
        - inviteUrl
        - token
        - expiresAt
        - expiresAtLabel
    ActiveInviteStatusDto:
      type: object
      properties:
        hasActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
        expiresAtLabel:
          type: string
          nullable: true
          example: null
      required:
        - hasActive
        - expiresAt
        - expiresAtLabel
    InvitePreviewDto:
      type: object
      properties:
        valid:
          type: boolean
      required:
        - valid
    InviteRegisterRequestDto:
      type: object
      properties:
        name:
          type: string
          example: Иван Петров
        phone:
          type: string
          example: "+79161234567"
          description: Телефон (E.164 или RU-формат)
        login:
          type: string
          example: ivan_client
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          format: password
      required:
        - name
        - phone
        - login
        - password
    CreateTrainerRequestDto:
      type: object
      properties:
        login:
          type: string
          example: newtrainer
          minLength: 3
          maxLength: 32
        password:
          type: string
          example: SecretPass1!
          minLength: 8
          format: password
      required:
        - login
        - password
    StaffUserDto:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - TRAINER
            - CLIENT
      required:
        - id
        - login
        - role
    StaffListResponseDto:
      type: object
      properties:
        trainers:
          type: array
          items:
            $ref: "#/components/schemas/StaffUserDto"
      required:
        - trainers
    ExerciseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Жим лёжа
        archivedAt:
          type: string
          format: date-time
          nullable: true
        missingMuscleGroupsWarning:
          type: boolean
          description: true, если у упражнения нет ни основной, ни дополнительных мышечных
            групп
        primaryMuscleGroupId:
          type: string
          nullable: true
        secondaryMuscleGroupIds:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - missingMuscleGroupsWarning
        - secondaryMuscleGroupIds
    ExerciseListResponseDto:
      type: object
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseDto"
      required:
        - exercises
    CreateExerciseRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        primaryMuscleGroupId:
          type: string
        secondaryMuscleGroupIds:
          type: array
          items:
            type: string
      required:
        - name
    UpdateExerciseRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        primaryMuscleGroupId:
          type: string
          nullable: true
        secondaryMuscleGroupIds:
          type: array
          items:
            type: string
    MuscleGroupDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Грудь
        sortOrder:
          type: number
          nullable: true
      required:
        - id
        - name
    MuscleGroupListResponseDto:
      type: object
      properties:
        muscleGroups:
          type: array
          items:
            $ref: "#/components/schemas/MuscleGroupDto"
      required:
        - muscleGroups
    TemplateExerciseDto:
      type: object
      properties:
        id:
          type: string
        exerciseId:
          type: string
        exerciseName:
          type: string
          nullable: true
        sortOrder:
          type: number
        plannedSets:
          type: number
          nullable: true
        plannedReps:
          type: number
          nullable: true
        plannedWeightKg:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - exerciseId
        - sortOrder
    WorkoutTemplateDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          example: strength
        description:
          type: string
          nullable: true
        durationMinutes:
          type: number
          nullable: true
        microcycleWeeks:
          type: number
          nullable: true
        version:
          type: number
        archivedAt:
          type: string
          format: date-time
          nullable: true
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExerciseDto"
      required:
        - id
        - name
        - type
        - version
        - exercises
    WorkoutTemplateListResponseDto:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutTemplateDto"
      required:
        - templates
    TemplateExerciseInputDto:
      type: object
      properties:
        exerciseId:
          type: string
        sortOrder:
          type: number
        plannedSets:
          type: number
          nullable: true
        plannedReps:
          type: number
          nullable: true
        plannedWeightKg:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - exerciseId
        - sortOrder
    CreateWorkoutTemplateRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 2000
          nullable: true
        durationMinutes:
          type: number
          nullable: true
        microcycleWeeks:
          type: number
          nullable: true
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExerciseInputDto"
      required:
        - name
        - type
        - exercises
    UpdateWorkoutTemplateRequestDto:
      type: object
      properties:
        version:
          type: number
          description: Expected template version for optimistic concurrency
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 2000
          nullable: true
        durationMinutes:
          type: number
          nullable: true
        microcycleWeeks:
          type: number
          nullable: true
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/TemplateExerciseInputDto"
      required:
        - version
        - name
        - type
        - exercises
    MacrocycleStageDto:
      type: object
      properties:
        id:
          type: string
        templateId:
          type: string
        templateName:
          type: string
          nullable: true
        sortOrder:
          type: number
      required:
        - id
        - templateId
        - sortOrder
    MacrocycleDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        periodicityNote:
          type: string
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/MacrocycleStageDto"
      required:
        - id
        - name
        - stages
    MacrocycleListResponseDto:
      type: object
      properties:
        macrocycles:
          type: array
          items:
            $ref: "#/components/schemas/MacrocycleDto"
      required:
        - macrocycles
    MacrocycleStageCreateInputDto:
      type: object
      properties:
        templateId:
          type: string
        sortOrder:
          type: number
      required:
        - templateId
        - sortOrder
    CreateMacrocycleRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        periodicityNote:
          type: string
          maxLength: 2000
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/MacrocycleStageCreateInputDto"
      required:
        - name
        - stages
    UpdateMacrocycleStageInputDto:
      type: object
      properties:
        id:
          type: string
        templateId:
          type: string
        sortOrder:
          type: number
      required:
        - templateId
        - sortOrder
    UpdateMacrocycleRequestDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        periodicityNote:
          type: string
          maxLength: 2000
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/UpdateMacrocycleStageInputDto"
      required:
        - name
        - stages
    AssignWorkoutRequestDto:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        templateId:
          type: string
      required:
        - scheduledAt
    WorkoutDto:
      type: object
      properties:
        id:
          type: string
        clientProfileId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - attended
            - skipped
            - cancelled
        isOverdue:
          type: boolean
          description: Pending workout scheduled before gym-local today (AD-17, BFF-only)
        templateId:
          type: string
          nullable: true
        templateName:
          type: string
          nullable: true
        sourceStageId:
          type: string
          nullable: true
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientProfileId
        - scheduledAt
        - status
        - isOverdue
        - createdByUserId
        - createdAt
        - updatedAt
    WorkoutListResponseDto:
      type: object
      properties:
        workouts:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutDto"
      required:
        - workouts
    RescheduleWorkoutRequestDto:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
      required:
        - scheduledAt
