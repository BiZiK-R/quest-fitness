info:
  title: Quest Fitness API
  description: Quest Fitness BFF
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          example: ok
          enum:
            - ok
      required:
        - status
    LoginRequestDto:
      type: object
      properties:
        login:
          type: string
          example: adminuser
          description: Логин (lowercase) или телефон E.164 / RU-формат
          minLength: 3
          maxLength: 32
        password:
          type: string
          example: SecretPass1!
          minLength: 8
          format: password
      required:
        - login
        - password
    LoginResponseDto:
      type: object
      properties:
        csrfToken:
          type: string
          description: CSRF token for mutating requests (header x-csrf-token)
      required:
        - csrfToken
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN_ROLE
        - CSRF_INVALID
        - NOT_FOUND
        - CLIENT_LOCKED
        - LOCK_REQUIRED
        - TEMPLATE_VERSION_CONFLICT
        - INVITE_EXPIRED
        - INVITE_ALREADY_CONSUMED
        - SESSION_ABANDONED
        - SESSION_ALREADY_ACTIVE
        - WORKOUT_STATUS_CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorBodyDto:
      type: object
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorEnvelopeDto:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorBodyDto"
      required:
        - error
    LogoutResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    MeResponseDto:
      type: object
      properties:
        id:
          type: string
          example: cluser123
        login:
          type: string
          example: adminuser
        role:
          type: string
          enum:
            - ADMIN
            - TRAINER
            - CLIENT
          example: ADMIN
      required:
        - id
        - login
        - role
    TrainerPingResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required:
        - ok
    CreateClientRequestDto:
      type: object
      properties:
        displayName:
          type: string
          example: Иван Пуловой
          description: Отображаемое имя слота клиента в общем пуле
          minLength: 1
          maxLength: 128
      required:
        - displayName
    ClientLockStatusDto:
      type: object
      properties:
        holderTrainerId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - holderTrainerId
        - expiresAt
    ClientProfileDto:
      type: object
      properties:
        id:
          type: string
          example: clxyz123
        displayName:
          type: string
          example: Иван Пуловой
        userId:
          type: string
          nullable: true
          example: null
          description: Привязка к User после регистрации по инвайту (Story 2.2)
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lockStatus:
          nullable: true
          description: Live lock held by another trainer; null when free or expired
          type: object
          allOf:
            - $ref: "#/components/schemas/ClientLockStatusDto"
      required:
        - id
        - displayName
        - userId
        - deactivatedAt
        - createdAt
        - updatedAt
    ClientListResponseDto:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientProfileDto"
      required:
        - clients
    ResetClientPasswordResponseDto:
      type: object
      properties:
        temporaryPassword:
          type: string
          description: Временный пароль — показывается один раз (Story 2.6)
          minLength: 8
      required:
        - temporaryPassword
    ClientLockResponseDto:
      type: object
      properties:
        holderTrainerId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - holderTrainerId
        - expiresAt
    IssueInviteResponseDto:
      type: object
      properties:
        inviteUrl:
          type: string
          example: /invite/abc123opaque
          description: Относительный путь для SPA; origin добавляет FE
        token:
          type: string
          description: Plain token — возвращается один раз при выдаче
        expiresAt:
          type: string
          format: date-time
        expiresAtLabel:
          type: string
          example: до 30 сентября 2026 г., 18:00
          description: Отображение срока в GYM_TIMEZONE (AD-17)
      required:
        - inviteUrl
        - token
        - expiresAt
        - expiresAtLabel
    ActiveInviteStatusDto:
      type: object
      properties:
        hasActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
        expiresAtLabel:
          type: string
          nullable: true
          example: null
      required:
        - hasActive
        - expiresAt
        - expiresAtLabel
    InvitePreviewDto:
      type: object
      properties:
        valid:
          type: boolean
      required:
        - valid
    InviteRegisterRequestDto:
      type: object
      properties:
        name:
          type: string
          example: Иван Петров
        phone:
          type: string
          example: "+79161234567"
          description: Телефон (E.164 или RU-формат)
        login:
          type: string
          example: ivan_client
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          format: password
      required:
        - name
        - phone
        - login
        - password
    CreateTrainerRequestDto:
      type: object
      properties:
        login:
          type: string
          example: newtrainer
          minLength: 3
          maxLength: 32
        password:
          type: string
          example: SecretPass1!
          minLength: 8
          format: password
      required:
        - login
        - password
    StaffUserDto:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - TRAINER
            - CLIENT
      required:
        - id
        - login
        - role
    StaffListResponseDto:
      type: object
      properties:
        trainers:
          type: array
          items:
            $ref: "#/components/schemas/StaffUserDto"
      required:
        - trainers
